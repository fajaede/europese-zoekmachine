<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Dashboard - Europese Zoekmachine API</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .header p { opacity: 0.9; font-size: 1.1em; }
        .content { padding: 40px; }
        .section { margin-bottom: 40px; }
        .section h2 { color: #667eea; margin-bottom: 20px; font-size: 1.8em; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102,126,234,0.4); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .result-box {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .success { border-color: #4caf50; background: #e8f5e9; }
        .error { border-color: #f44336; background: #ffebee; }
        .api-key-display {
            background: #fff3cd;
            border: 2px solid #ffc107;
            padding: 16px;
            border-radius: 8px;
            margin-top: 16px;
            font-family: monospace;
            font-size: 16px;
            word-break: break-all;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 24px;
            border-radius: 12px;
            text-align: center;
        }
        .stat-card h3 { font-size: 2.5em; margin-bottom: 8px; }
        .stat-card p { opacity: 0.9; }
        .loading { opacity: 0.6; pointer-events: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Developer Dashboard</h1>
            <p>Europese Zoekmachine API - SEO Generatie Tool</p>
        </div>
        
        <div class="content">
            <!-- Registratie Sectie -->
            <div class="section">
                <h2>📧 Registreer voor API Access</h2>
                <div class="form-group">
                    <label for="email">Email adres</label>
                    <input type="email" id="email" placeholder="jouw@email.nl" />
                </div>
                <div class="form-group">
                    <label for="project">Project naam (optioneel)</label>
                    <input type="text" id="project" placeholder="Mijn Project" />
                </div>
                <button class="btn" onclick="register()">Registreer & Krijg API Key</button>
                <div id="registerResult"></div>
            </div>
            
            <!-- SEO Generatie Sectie -->
            <div class="section">
                <h2>✨ Genereer SEO Metadata</h2>
                <div class="form-group">
                    <label for="apiKey">API Key</label>
                    <input type="text" id="apiKey" placeholder="sk_eu_..." />
                </div>
                <div class="form-group">
                    <label for="content">Content</label>
                    <textarea id="content" rows="6" placeholder="Plak je content hier..."></textarea>
                </div>
                <div class="form-group">
                    <label for="url">URL (optioneel)</label>
                    <input type="url" id="url" placeholder="https://jouwsite.nl/pagina" />
                </div>
                <div class="form-group">
                    <label for="language">Taal</label>
                    <select id="language" style="width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:8px;font-size:16px;">
                        <option value="nl">Nederlands</option>
                        <option value="en">Engels</option>
                        <option value="de">Duits</option>
                        <option value="fr">Frans</option>
                    </select>
                </div>
                <button class="btn" onclick="generateSEO()">Genereer SEO</button>
                <div id="seoResult"></div>
            </div>
            
            <!-- Usage Stats Sectie -->
            <div class="section">
                <h2>📊 Usage Statistics</h2>
                <div class="form-group">
                    <label for="apiKeyStats">API Key</label>
                    <input type="text" id="apiKeyStats" placeholder="sk_eu_..." />
                </div>
                <button class="btn" onclick="getUsage()">Bekijk Stats</button>
                <div id="statsResult"></div>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE = window.location.origin + '/api/developers';
        
        async function register() {
            const email = document.getElementById('email').value.trim();
            const project = document.getElementById('project').value.trim();
            const resultDiv = document.getElementById('registerResult');
            
            if (!email) {
                resultDiv.innerHTML = '<div class="result-box error">❌ Vul een email adres in</div>';
                return;
            }
            
            try {
                const response = await fetch(API_BASE + '/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, project_name: project || undefined })
                });
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="result-box success">
                            ✅ ${data.message}
                            <div class="api-key-display">🔑 ${data.api_key}</div>
                            <p style="margin-top:12px;font-size:13px;color:#666;">Bewaar deze key goed! Je hebt hem nodig voor SEO generatie.</p>
                        </div>
                    `;
                    // Auto-fill API key in andere velden
                    document.getElementById('apiKey').value = data.api_key;
                    document.getElementById('apiKeyStats').value = data.api_key;
                } else {
                    resultDiv.innerHTML = `<div class="result-box error">❌ ${data.detail || 'Fout bij registratie'}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="result-box error">❌ ${error.message}</div>`;
            }
        }
        
        async function generateSEO() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const content = document.getElementById('content').value.trim();
            const url = document.getElementById('url').value.trim();
            const language = document.getElementById('language').value;
            const resultDiv = document.getElementById('seoResult');
            
            if (!apiKey || !content) {
                resultDiv.innerHTML = '<div class="result-box error">❌ Vul API key en content in</div>';
                return;
            }
            
            resultDiv.innerHTML = '<div class="result-box">⏳ Genereren...</div>';
            
            try {
                const response = await fetch(API_BASE + '/seo/generate', {
                    method: 'POST',
                    headers: {
                        'X-API-Key': apiKey,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ content, url: url || undefined, language })
                });
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="result-box success">
                            <strong>✅ SEO Metadata Gegenereerd (Score: ${data.score}/100)</strong>
                            
                            <p style="margin-top:16px;"><strong>Title:</strong><br>${data.title}</p>
                            <p style="margin-top:12px;"><strong>Meta Description:</strong><br>${data.meta_description}</p>
                            <p style="margin-top:12px;"><strong>Keywords:</strong><br>${data.keywords.join(', ')}</p>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `<div class="result-box error">❌ ${data.detail || data.message || 'Fout bij genereren'}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="result-box error">❌ ${error.message}</div>`;
            }
        }
        
        async function getUsage() {
            const apiKey = document.getElementById('apiKeyStats').value.trim();
            const resultDiv = document.getElementById('statsResult');
            
            if (!apiKey) {
                resultDiv.innerHTML = '<div class="result-box error">❌ Vul API key in</div>';
                return;
            }
            
            try {
                const response = await fetch(API_BASE + '/usage', {
                    method: 'GET',
                    headers: { 'X-API-Key': apiKey }
                });
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="stats-grid">
                            <div class="stat-card">
                                <h3>${data.requests_today}</h3>
                                <p>Requests Vandaag</p>
                            </div>
                            <div class="stat-card">
                                <h3>${data.daily_limit}</h3>
                                <p>Daily Limit</p>
                            </div>
                            <div class="stat-card">
                                <h3>${data.total_requests}</h3>
                                <p>Totaal Requests</p>
                            </div>
                            <div class="stat-card">
                                <h3>${new Date(data.created_at).toLocaleDateString('nl-NL')}</h3>
                                <p>Geregistreerd</p>
                            </div>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `<div class="result-box error">❌ ${data.detail || 'Fout bij ophalen stats'}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="result-box error">❌ ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
